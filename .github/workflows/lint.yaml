name: frontend lint

on:
  push:
    branches: [ dev ]
    paths:
      - "src/**"
      - ".eslintrc*"
      - ".prettierrc*"
      - "package.json"
      - "yarn.lock"
  pull_request:
    branches: [ dev, main ]
    paths:
      - "src/**"
      - ".eslintrc*"
      - ".prettierrc*"
      - "package.json"
      - "yarn.lock"

permissions:
  contents: read

concurrency:
  group: fe-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Start
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🔍 **Запуск линта фронта**
            Репозиторий: `${{ github.repository }}`
            Ветка / PR: `${{ github.ref }}`
            Автор: `${{ github.actor }}`
            Триггер: `${{ github.event_name }}`
            🔗 [Workflow](https://github.)
